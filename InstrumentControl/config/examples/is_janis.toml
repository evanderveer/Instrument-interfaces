# Configuration for ISProcedureJanis
# Temperature-dependent impedance spectroscopy using the Janis probe station.
#
# Usage:
#   from InstrumentControl.procedures import ISProcedureJanis
#   from InstrumentControl.runner import Measurement
#
#   m = Measurement.from_config(ISProcedureJanis, "config/examples/is_janis.toml")
#   m.filename = "results/janis_run.csv"
#   m.run()

[instruments]
janis_address = "GPIB0::12::INSTR"
lcr_address   = "GPIB0::17::INSTR"

[measurement]
# Ordered list of temperature setpoints (K)
temperature_points = [200.0, 250.0, 300.0]

# DC bias voltages (V, range -40 to +40)
bias_points = [0.0, 1.0, 2.0]

# AC frequencies (Hz, range 20–2_000_000)
frequency_points = [
    1_000.0,
    10_000.0,
    100_000.0,
]
